# Build Ballista (and the spark/ workspace, which reads this file too) against the
# DataFusion 55.2.0 fork with grace-hash-join spilling:
#   ~/Documents/datafusion, branch df-55.2.0-ballista
# Paths are relative to this directory's parent (the repository root).
# Every DataFusion crate in the dependency graph must be listed: a crate left on
# crates.io would put two incompatible copies of DataFusion in one build.
[patch.crates-io]
datafusion = { path = "../../datafusion/datafusion/core" }
datafusion-catalog = { path = "../../datafusion/datafusion/catalog" }
datafusion-catalog-listing = { path = "../../datafusion/datafusion/catalog-listing" }
