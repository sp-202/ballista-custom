<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballista UI</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/jobs" title="Ballista scheduler">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>
    <span>Ballista</span><small id="version"></small>
  </a>
  <nav id="nav">
    <a href="#/jobs" data-tab="jobs">Jobs</a>
    <a href="#/stages" data-tab="stages">Stages</a>
    <a href="#/executors" data-tab="executors">Executors</a>
    <a href="#/environment" data-tab="environment">Environment</a>
  </nav>
  <div class="status">
    <span class="dot" id="conn"></span><span id="conn-text">connecting…</span>
    <label class="refresh"><input type="checkbox" id="auto" checked> auto-refresh</label>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<script src="ui.js"></script>
</body>
</html>
