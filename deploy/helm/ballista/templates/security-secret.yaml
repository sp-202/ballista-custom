{{- if and .Values.security.enabled (not .Values.security.existingSecret) }}
{{- $name := include "ballista.securitySecret" . }}
{{- $fullname := include "ballista.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- /* Reuse what an earlier install generated: certificates and tokens stay stable
       across upgrades. Delete the Secret to rotate them. */}}
{{- $existing := lookup "v1" "Secret" $ns $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ballista.labels" . | nindent 4 }}
    app.kubernetes.io/component: security
type: Opaque
data:
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") }}
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
  {{- /* One certificate for both ends of every connection (mutual TLS). Executors
         are reached by pod IP, so peers check the fixed name ballista-internal. */}}
  {{- $names := list "ballista-internal" "localhost" }}
  {{- range $svc := list "scheduler" "connect" "history" }}
  {{- $base := printf "%s-%s" $fullname $svc }}
  {{- $names = concat $names (list $base (printf "%s.%s" $base $ns) (printf "%s.%s.svc" $base $ns) (printf "%s.%s.svc.cluster.local" $base $ns)) }}
  {{- end }}
  {{- $days := int .Values.security.certValidityDays }}
  {{- $ca := genCA (printf "Ballista cluster CA %s/%s" $ns .Release.Name) $days }}
  {{- $cert := genSignedCert (printf "%s.%s" $fullname $ns) (list "127.0.0.1") $names $days $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ui-token: {{ randAlphaNum 48 | b64enc }}
  connect-token: {{ randAlphaNum 48 | b64enc }}
{{- end }}
{{- end }}
