apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "op.fullname" . }}
  labels:
    {{- include "op.labels" . | nindent 4 }}
spec:
  # Controllers are not leader-elected yet: run exactly one.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "op.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "op.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "op.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ballista-operator", "run"]
          env:
            - {name: RUST_LOG, value: {{ .Values.logLevel | quote }}}
            - {name: BALLISTA_DRIVER_IMAGE, value: {{ .Values.driverImage | quote }}}
            {{- with .Values.watchNamespace }}
            - {name: WATCH_NAMESPACE, value: {{ . | quote }}}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
