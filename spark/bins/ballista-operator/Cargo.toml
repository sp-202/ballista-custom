[package]
name = "ballista-operator"
description = "Kubernetes operator for Ballista: BallistaCluster (scheduler, executors, dynamic allocation) and BallistaApplication (SparkApplication-style batch jobs)"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

[lints]
workspace = true

[dependencies]
kube = { workspace = true, features = ["runtime", "derive"] }
k8s-openapi = { workspace = true, features = ["schemars"] }
schemars = "1"
rustls = { workspace = true, features = ["ring"] }
rcgen = "0.14"
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
http = "1"
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
